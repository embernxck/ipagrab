[package]
name = "ipagrab"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
idevice = { version = "0.1.68", default-features = false, features = ["ring", "usbmuxd", "afc", "installation_proxy", "springboardservices"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
plist = "1.10.4"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "fs", "macros"] }
ureq = { version = "3", features = ["json"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Threading"] }
zip = "9.8.1"
